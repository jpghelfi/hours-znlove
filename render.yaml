# Render Blueprint — deploy the hours-tracker web app on the free tier.
# In Render: New + → Blueprint → connect this repo. Then set the secret env vars
# (marked sync:false) in the dashboard. Free instances sleep when idle and wake
# on the next request (~30–60s cold start) — fine for low traffic.
services:
  - type: web
    name: hours-znlove
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: NOTION_TOKEN
        sync: false
      - key: PROJECTS_DS_ID
        sync: false
      - key: TIME_ENTRIES_DS_ID
        sync: false
      - key: ALLOCATIONS_DS_ID
        sync: false
      - key: PEOPLE_DS_ID
        sync: false
      # Absences (src/setup_absences_db.py). Unset just hides the feature behind
      # a "not set up yet" note — /absences still renders.
      - key: ABSENCES_DS_ID
        sync: false
      # Goals (src/setup_goals_db.py). Unset simply hides the feature: no goals
      # block on /project, no By goal on /reports, and the two write endpoints
      # refuse. Nothing else changes.
      - key: GOALS_DS_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: WEEK_TARGET_HOURS
        value: "40"
      - key: NOTION_OAUTH_CLIENT_ID
        sync: false
      - key: NOTION_OAUTH_CLIENT_SECRET
        sync: false
      - key: NOTION_OAUTH_REDIRECT_URI
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Emailing reports is off; flip REPORT_EMAIL_ENABLED to 1 to bring the
      # To/Subject/Send controls back on the export screen. The GOOGLE_* values
      # below serve the Sheets export too, so they don't switch email on.
      - key: REPORT_EMAIL_ENABLED
        value: "0"
      # When it is on, the send goes through the Gmail API over HTTPS, not SMTP:
      # free Render instances block outbound ports 25/465/587, so an SMTP send
      # can never connect from here. Mint the refresh token with
      # `python src/google_oauth_setup.py` (see its docstring for the Google
      # Cloud steps) and paste the three values in.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: REPORT_FROM
        sync: false
      - key: REPORT_TO
        value: zarco@znlove.xyz,angie@znlove.xyz
      # Budget threshold emails, on their own switch for the same reason
      # REPORT_EMAIL_ENABLED exists: the GOOGLE_* values above also power the
      # Sheets export, and connecting Google must not start emailing people
      # about budgets uninvited. The rest of the feature — /budgets, the cap,
      # the meter on the log form — works with this off.
      - key: BUDGET_ALERTS_ENABLED
        value: "0"
      # Falls back to REPORT_TO when unset.
      - key: BUDGET_ALERT_TO
        sync: false
      # Percentage of a project's monthly budget at which it warns, when the
      # project's own "Warn at %" is blank. Harvest defaults to 80; 95 fits a
      # monthly allowance better.
      - key: BUDGET_WARN_PCT
        value: "95"
      # Invoices (src/setup_invoices_db.py). Unset hides invoicing entirely —
      # no Invoice button, and /invoices explains what to run.
      - key: INVOICES_DS_ID
        sync: false
      - key: INVOICES_DB_ID
        sync: false
      # Emailing an *invoice* is the only thing this app sends outside the
      # company, so it gets its own switch rather than riding the report one:
      # turning on internal report email must not arm a button that mails a
      # bill to a client. Downloading the PDF works with this off.
      - key: INVOICE_EMAIL_ENABLED
        value: "0"
      # Blind copy on every invoice sent. Empty = nobody.
      - key: INVOICE_CC
        sync: false
      # What the invoice PDF says about the sender. All of it is presentation,
      # so it lives here rather than in Notion or the code. Use "|" for a line
      # break inside a value.
      - key: INVOICE_COMPANY
        value: ZN Love
      - key: INVOICE_COMPANY_DETAILS
        sync: false
      - key: INVOICE_PAYMENT
        sync: false
      - key: INVOICE_FOOTER
        sync: false
      # Tax is a property of the sender, not of a project: the rate lives on
      # the project in Notion, the tax rate here. 0 prints no tax line.
      - key: INVOICE_TAX_LABEL
        value: VAT
      - key: INVOICE_TAX_PCT
        value: "0"
      # 0 prints no due date.
      - key: INVOICE_DUE_DAYS
        value: "0"
      # The currency a project falls back to when its own Currency is blank.
      - key: INVOICE_CURRENCY
        value: USD
      # Rides in front of the year-sequence number ("ZN-2026-014"). Empty is fine.
      - key: INVOICE_NUMBER_PREFIX
        sync: false
      # The one board "＋ New ticket" writes to (a data source id). Creating is
      # the only ticket feature that *writes* to Notion, so it targets exactly
      # one board named here — never one the browser picks — and the button
      # isn't rendered at all while this is unset.
      - key: TICKET_CREATE_DS_ID
        sync: false
